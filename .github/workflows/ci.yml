name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gates only need to read the checkout.
permissions:
  contents: read

jobs:
  gates:
    name: drift-gate · tests · lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Proves the stdlib build (tomllib) works on every supported runtime.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Drift gate — dist/ must match the source
        run: python scripts/build.py --check

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: python -m ruff check .
