name: Bug report
description: Report drift, bad output, or tooling behavior that does not match the contract.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough evidence for a cold clone
        reviewer to reproduce the behavior.
  - type: textarea
    id: current
    attributes:
      label: What happened?
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Name the contract or command result you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, modified files, and output.
      render: bash
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, snippets, or platform details that help explain the issue.
    validations:
      required: false
